<svg width="680" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Providerenkénti párhuzamossági szabályozó</title>
  <desc>
    Három párhuzamos workflow futás kész agent lépései egy közös várakozó sorba kerülnek. A minimax
    providerhez tartozó szabályozónak négy helye van, ebből három foglalt, egy szabad. Csak a helyet
    kapott lépés hív a MiniMax felé.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="#5F5E5A"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
  </defs>

  <rect x="90" y="50" width="150" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" />
  <text x="165" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Futás A</text>
  <text x="165" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">2 kész lépés</text>

  <rect x="265" y="50" width="150" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" />
  <text x="340" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Futás B</text>
  <text x="340" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">3 kész lépés</text>

  <rect x="440" y="50" width="150" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" />
  <text x="515" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Futás C</text>
  <text x="515" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">1 kész lépés</text>

  <line x1="165" y1="104" x2="165" y2="138" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)" />
  <line x1="340" y1="104" x2="340" y2="138" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)" />
  <line x1="515" y1="104" x2="515" y2="138" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)" />

  <rect x="90" y="140" width="500" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" />
  <text x="340" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Közös várakozó sor</text>
  <text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">6 lépés vár indulásra, érkezési sorrendben</text>

  <line x1="340" y1="194" x2="340" y2="228" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)" />

  <rect x="90" y="230" width="500" height="100" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3" />
  <text x="106" y="252" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Szabályozó, provider: minimax</text>

  <rect x="116" y="268" width="100" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" />
  <text x="166" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Fut</text>

  <rect x="232" y="268" width="100" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" />
  <text x="282" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Fut</text>

  <rect x="348" y="268" width="100" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" />
  <text x="398" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Fut</text>

  <rect x="464" y="268" width="100" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" />
  <text x="514" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Szabad</text>

  <line x1="340" y1="330" x2="340" y2="364" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)" />

  <rect x="190" y="366" width="300" height="54" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" />
  <text x="340" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">MiniMax M3</text>
  <text x="340" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">200 kérés / perc, dokumentált</text>
</svg>
